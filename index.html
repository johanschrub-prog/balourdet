<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>INVENTAIRE HDLP</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

body{
font-family:Segoe UI,sans-serif;
margin:0;
background:#f5f6f8;
}

header{
background:#0a66ff;
color:white;
padding:15px;
text-align:center;
}

.tabs{
display:flex;
flex-wrap:wrap;
gap:5px;
padding:10px;
background:white;
}

.tab{
padding:8px;
border:none;
border-radius:8px;
cursor:pointer;
}

.active{
background:#0a66ff;
color:white;
}

.toolbar{
padding:10px;
background:white;
display:flex;
gap:10px;
flex-wrap:wrap;
}

input{
padding:10px;
}

.card{
background:white;
margin:5px;
padding:8px;
border-radius:12px;
}

.nav{
display:flex;
gap:10px;
margin-top:5px;
margin-bottom:0;
padding-bottom:0;
}

</style>

</head>

<body>


<div id="tabs" class="tabs"></div>

<div class="toolbar">

<input
id="search"
placeholder="Recherche"
oninput="rechercher()">
  <div
    
id="resultatsRecherche"
style="
background:white;
margin-top:5px;
border:1px solid #ddd;
border-radius:8px;
max-height:250px;
overflow-y:auto;
">
</div>
  
<input
type="file"
id="fichierFournisseur"
style="display:none"
accept=".xlsx"
onchange="importerFournisseur(event)">
 <button onclick="sauvegarderCommandeJSON()">
💾 Sauvegarder
</button>

<input
type="file"
id="restoreCommande"
style="display:none"
onchange="restaurerCommandeJSON(event)">

<button
onclick="
document.getElementById(
'restoreCommande'
).click()">
📂 Reprendre
</button>
<button
onclick="document.getElementById('fichierFournisseur').click()">
📥 Import Liste Produit Fournisseur
</button>
  
  <button onclick="scannerCodeBarre()">
📷 Scanner
</button>
 
<button onclick="exportExcel()">
📤 Export Excel
  </button>
  
  <button onclick="remiseAZero()">
🔄 Remise à zéro
</button>
  
  <button onclick="afficherOnglets()">
📋 Onglets
</button>
  
</div>
<div
id="scannerZone"
style="
display:none;
background:white;
padding:10px;
margin:10px;
border-radius:12px;
">
<div id="reader"></div>
</div>
<div id="contenu"></div>

<div
id="scannerZone"
style="
display:none;
background:white;
padding:10px;
margin:10px;
border-radius:12px;
">
    <div id="reader"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script src="https://unpkg.com/html5-qrcode"></script>
<div id="fenetreAssociation"
style="
display:none;
position:fixed;
top:10%;
left:5%;
right:5%;
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 0 20px rgba(0,0,0,.3);
z-index:9999;
">

<h3>Associer un code-barres</h3>

<div id="codeInconnu"></div>

<input
id="rechercheProduit"
placeholder="Recherche produit"
oninput="chercherProduitAssociation()">

<div
id="listeProduits"
style="
margin-top:10px;
max-height:300px;
overflow:auto;
">
</div>

</div>

<script src="app.js"></script>

</body>
</html>
