<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Commande Fournisseur</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

body{
    font-family:Segoe UI,sans-serif;
    margin:0;
    background:#f5f6f8;
}

.tabs{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    padding:10px;
    background:white;
}

.tab{
    border:none;
    border-radius:8px;
    padding:8px;
    cursor:pointer;
}

.toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    padding:10px;
    background:white;
}

input{
    padding:10px;
}

.card{
    background:white;
    margin:10px;
    padding:15px;
    border-radius:12px;
}

.nav{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:10px;
}

#resultatsRecherche{
    background:white;
    border:1px solid #ddd;
    border-radius:8px;
    max-height:300px;
    overflow:auto;
    width:100%;
}

</style>

</head>

<body>

<div id="tabs" class="tabs"></div>

<div class="toolbar">

<input
id="search"
placeholder="Recherche"
oninput="rechercher()">

<div id="resultatsRecherche"></div>

<input
type="file"
id="importExcel"
style="display:none"
accept=".xlsx"
onchange="importerExcel(event)">

<button
onclick="document.getElementById('importExcel').click()">
📥 Import Excel
</button>

<button onclick="sauvegarderJSON()">
💾 Sauvegarder
</button>

<input
type="file"
id="restoreJSON"
style="display:none"
accept=".json"
onchange="restaurerJSON(event)">

<button
onclick="document.getElementById('restoreJSON').click()">
📂 Reprendre
</button>

<button onclick="afficherOnglets()">
📋 Onglets
</button>

</div>

<div id="contenu"></div>

<script src="app.js"></script>

</body>
</html>
